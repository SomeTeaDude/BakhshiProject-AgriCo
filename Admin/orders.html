<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مدیریت سفارشات - پنل مدیریت فروشگاه کشاورزی</title>

    <!-- Bootstrap 5 RTL -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Vazirmatn Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Css/orders.css" />
  </head>
  <body>
    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="p-4">
        <h4 class="mb-4">
          <i class="fas fa-leaf me-2"></i>
          پنل مدیریت
        </h4>
      </div>

      <nav class="nav flex-column">
        <a class="nav-link" href="Dashboard.html" data-section="dashboard">
          <i class="fas fa-chart-line ms-2"></i>
          داشبورد
        </a>
        <a class="nav-link" href="products.html" data-section="products">
          <i class="fas fa-seedling ms-2"></i>
          مدیریت محصولات
        </a>
        <a class="nav-link" href="users.html" data-section="users">
          <i class="fas fa-users ms-2"></i>
          مدیریت کاربران
        </a>
        <a class="nav-link" href="payments.html" data-section="Payments">
          <i class="fas fa-money-check ms-2"></i>
          مدیریت پرداخت
        </a>
        <a class="nav-link" href="orders.html" data-section="orders">
          <i class="fas fa-shopping-cart ms-2"></i>
          سفارش‌ها
        </a>
        <a class="nav-link" href="courses.html" data-section="courses">
          <i class="fas fa-video ms-2"></i>
          مدیریت دوره‌ها
        </a>
        <a class="nav-link" href="news.html" data-section="news">
          <i class="fas fa-newspaper ms-2"></i>
          مدیریت اخبار
        </a>
        <a class="nav-link" href="support.html" data-section="support">
          <i class="fas fa-headset ms-2"></i>
          پشتیبانی و چت
        </a>
        <hr class="my-3" />
        <a class="nav-link" href="../home.html">
          <i class="fas fa-store ms-2"></i>
          مشاهده فروشگاه
        </a>
        <a class="nav-link" href="#" onclick="AdminPanelState.logout()">
          <i class="fas fa-sign-out-alt ms-2"></i>
          خروج
        </a>
      </nav>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Header -->
      <header class="header">
        <div class="container-fluid">
          <div class="row align-items-center">
            <div class="col-6 col-md-8">
              <div class="d-flex align-items-center">
                <button
                  class="btn btn-outline-success d-lg-none me-3"
                  id="toggleSidebar"
                >
                  <i class="fas fa-bars"></i>
                </button>
                <h3 class="mb-0" id="pageTitle">مدیریت سفارشات</h3>
              </div>
            </div>
            <div class="col-6 col-md-4">
              <div class="d-flex align-items-center justify-content-end">
                <span class="me-2 d-none d-sm-inline">خوش آمدید، مدیر</span>
                <div
                  class="bg-success rounded-circle d-flex align-items-center justify-content-center"
                  style="width: 40px; height: 40px"
                >
                  <i class="fas fa-user text-white"></i>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- Orders Section -->
      <section id="ordersSection" class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4>سفارش‌ها</h4>
          <div class="btn-group">
            <button
              class="btn btn-outline-success active"
              onclick="OrdersManager.filterOrders('all')"
            >
              همه
            </button>
            <button
              class="btn btn-outline-warning"
              onclick="OrdersManager.filterOrders('pending')"
            >
              در انتظار
            </button>
            <button
              class="btn btn-outline-info"
              onclick="OrdersManager.filterOrders('processing')"
            >
              در حال پردازش
            </button>
            <button
              class="btn btn-outline-primary"
              onclick="OrdersManager.filterOrders('shipped')"
            >
              ارسال شده
            </button>
            <button
              class="btn btn-outline-success"
              onclick="OrdersManager.filterOrders('completed')"
            >
              تکمیل شده
            </button>
            <button
              class="btn btn-outline-danger"
              onclick="OrdersManager.filterOrders('cancelled')"
            >
              لغو شده
            </button>
          </div>
        </div>

        <div class="table-container">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th>شماره سفارش</th>
                  <th>نام کاربر</th>
                  <th>تاریخ</th>
                  <th>مبلغ</th>
                  <th>وضعیت</th>
                  <th>روش پرداخت</th>
                  <th>عملیات</th>
                </tr>
              </thead>
              <tbody id="ordersTable">
                <!-- Orders will be loaded here -->
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </div>

    <!-- Order Details Modal -->
    <div class="modal fade" id="orderModal" tabindex="-1">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">جزئیات سفارش</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body" id="orderDetails">
            <!-- Order details will be loaded here -->
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              بستن
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="OrdersManager.updateOrderStatus()"
            >
              بروزرسانی وضعیت
            </button>
            <button
              type="button"
              class="btn btn-success"
              onclick="OrdersManager.printInvoice()"
            >
              <i class="fas fa-print me-1"></i> چاپ فاکتور
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="JS/orders.js"></script>
  </body>
</html>

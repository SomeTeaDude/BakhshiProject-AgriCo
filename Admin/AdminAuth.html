<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود ادمین - پنل مدیریت فروشگاه کشاورزی</title>

    <!-- Bootstrap 5 RTL -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Vazirmatn Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="Css/AdminAuth.css" />
  </head>
  <body>
    <div class="login-container fade-in">
      <div class="login-header">
        <div class="logo">
          <i class="fas fa-leaf"></i>
        </div>
        <h4>پنل مدیریت فروشگاه</h4>
        <p class="mb-0">فروشگاه کشاورزی سبز</p>
      </div>

      <div class="login-body">
        <div id="loginAlert" class="alert alert-danger d-none">
          <i class="fas fa-exclamation-circle me-2"></i>
          <span id="alertMessage"></span>
        </div>

        <form id="adminLoginForm">
          <div class="mb-3">
            <label for="username" class="form-label">نام کاربری</label>
            <div class="input-group">
              <input
                type="text"
                class="form-control"
                id="username"
                placeholder="نام کاربری خود را وارد کنید"
                required
              />
              <span class="input-group-text">
                <i class="fas fa-user"></i>
              </span>
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">رمز عبور</label>
            <div class="input-group">
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="رمز عبور خود را وارد کنید"
                required
              />
              <span
                class="input-group-text password-toggle"
                onclick="togglePassword()"
              >
                <i class="fas fa-eye"></i>
              </span>
            </div>
          </div>

          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe" />
            <label class="form-check-label" for="rememberMe"
              >مرا به خاطر بسپار</label
            >
          </div>

          <button type="submit" class="btn btn-login" id="loginBtn">
            <div class="login-btn-content">
              <div class="loading-spinner" id="loginSpinner"></div>
              <span>ورود به پنل مدیریت</span>
            </div>
          </button>
        </form>

        <div class="security-info">
          <h6><i class="fas fa-shield-alt me-2"></i>اطلاعات امنیتی</h6>
          <ul>
            <li>این صفحه فقط برای دسترسی مدیران سیستم است</li>
            <li>اطلاعات ورود خود را محرمانه نگه دارید</li>
            <li>پس از اتمام کار از سیستم خارج شوید</li>
          </ul>
        </div>

        <div class="footer-links">
          <a href="../home.html"><i class="fas fa-store me-1"></i>فروشگاه</a>
          <a href="#" onclick="showSupport()"
            ><i class="fas fa-headset me-1"></i>پشتیبانی</a
          >
          <a href="#" onclick="showAbout()"
            ><i class="fas fa-info-circle me-1"></i>درباره سیستم</a
          >
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="JS/AdminAuth.js"></script>
  </body>
</html>

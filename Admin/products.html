<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مدیریت محصولات - پنل مدیریت فروشگاه کشاورزی</title>

    <!-- Bootstrap 5 RTL -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Vazirmatn Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="Css/products.css" />
  </head>
  <body>
    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="p-4">
        <h4 class="mb-4">
          <i class="fas fa-leaf me-2"></i>
          پنل مدیریت
        </h4>
      </div>

      <nav class="nav flex-column">
        <a class="nav-link" href="Dashboard.html" data-section="dashboard">
          <i class="fas fa-chart-line ms-2"></i>
          داشبورد
        </a>
        <a class="nav-link" href="products.html" data-section="products">
          <i class="fas fa-seedling ms-2"></i>
          مدیریت محصولات
        </a>
        <a class="nav-link" href="users.html" data-section="users">
          <i class="fas fa-users ms-2"></i>
          مدیریت کاربران
        </a>
        <a class="nav-link" href="payments.html" data-section="Payments">
          <i class="fas fa-money-check ms-2"></i>
          مدیریت پرداخت
        </a>
        <a class="nav-link" href="orders.html" data-section="orders">
          <i class="fas fa-shopping-cart ms-2"></i>
          سفارش‌ها
        </a>
        <a class="nav-link" href="courses.html" data-section="courses">
          <i class="fas fa-video ms-2"></i>
          مدیریت دوره‌ها
        </a>
        <a class="nav-link" href="news.html" data-section="news">
          <i class="fas fa-newspaper ms-2"></i>
          مدیریت اخبار
        </a>
        <a class="nav-link" href="support.html" data-section="support">
          <i class="fas fa-headset ms-2"></i>
          پشتیبانی و چت
        </a>
        <hr class="my-3" />
        <a class="nav-link" href="../home.html">
          <i class="fas fa-store ms-2"></i>
          مشاهده فروشگاه
        </a>
        <a class="nav-link" href="#" onclick="AdminPanelState.logout()">
          <i class="fas fa-sign-out-alt ms-2"></i>
          خروج
        </a>
      </nav>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Header -->
      <header class="header">
        <div class="container-fluid">
          <div class="row align-items-center">
            <div class="col-6 col-md-8">
              <div class="d-flex align-items-center">
                <button
                  class="btn btn-outline-success d-lg-none me-3"
                  id="toggleSidebar"
                >
                  <i class="fas fa-bars"></i>
                </button>
                <h3 class="mb-0" id="pageTitle">مدیریت محصولات</h3>
              </div>
            </div>
            <div class="col-6 col-md-4">
              <div class="d-flex align-items-center justify-content-end">
                <span class="me-2 d-none d-sm-inline">خوش آمدید، مدیر</span>
                <div
                  class="bg-success rounded-circle d-flex align-items-center justify-content-center"
                  style="width: 40px; height: 40px"
                >
                  <i class="fas fa-user text-white"></i>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- Products Section -->
      <section id="productsSection" class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4>مدیریت محصولات</h4>
          <button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#productModal"
          >
            <i class="fas fa-plus ms-1"></i>
            افزودن محصول جدید
          </button>
        </div>

        <div class="table-container">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th>تصویر</th>
                  <th>نام محصول</th>
                  <th>دسته‌بندی</th>
                  <th>قیمت</th>
                  <th>موجودی</th>
                  <th>وضعیت</th>
                  <th>عملیات</th>
                </tr>
              </thead>
              <tbody id="productsTable">
                <!-- Products will be loaded here -->
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </div>

    <!-- Product Modal -->
    <div class="modal fade" id="productModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="productModalTitle">
              افزودن محصول جدید
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="productForm">
              <input type="hidden" id="productId" />
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">نام محصول *</label>
                  <input
                    type="text"
                    class="form-control"
                    id="productName"
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">دسته‌بندی *</label>
                  <select class="form-select" id="productCategory" required>
                    <option value="">انتخاب کنید</option>
                    <option value="بذر">بذر</option>
                    <option value="کود">کود</option>
                    <option value="ابزار">ابزار کشاورزی</option>
                    <option value="آفت‌کش">آفت‌کش</option>
                  </select>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">قیمت (تومان) *</label>
                  <input
                    type="number"
                    class="form-control"
                    id="productPrice"
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">موجودی *</label>
                  <input
                    type="number"
                    class="form-control"
                    id="productStock"
                    required
                  />
                </div>
                <div class="col-12 mb-3">
                  <label class="form-label">توضیحات</label>
                  <textarea
                    class="form-control"
                    id="productDescription"
                    rows="3"
                  ></textarea>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">تصویر محصول</label>
                  <input
                    type="file"
                    class="form-control"
                    id="productImage"
                    accept="image/*"
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">وضعیت</label>
                  <select class="form-select" id="productStatus">
                    <option value="active">فعال</option>
                    <option value="inactive">غیرفعال</option>
                  </select>
                </div>
                <div class="col-12 mb-3">
                  <div id="imagePreview" style="display: none">
                    <img
                      id="previewImg"
                      class="img-thumbnail"
                      style="max-width: 200px"
                    />
                  </div>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              انصراف
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="ProductsManager.saveProduct()"
            >
              ذخیره
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="JS/products.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اخبار - فروشگاه کشاورزی</title>

    <!-- Bootstrap 5 RTL -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Vazirmatn Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="CSS/news.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="p-4">
        <h4 class="mb-4">
          <i class="fas fa-user-circle me-2"></i>
          پنل کاربری
        </h4>
      </div>

      <nav class="nav flex-column">
        <a
          class="nav-link "
          href="Dashboard.html"
          data-section="dashboard"
        >
          <i class="fas fa-chart-pie ms-2"></i>
          داشبورد
        </a>
        <a class="nav-link" href="payment.html" data-section="payments">
          <i class="fas fa-credit-card ms-2"></i>
          پرداخت‌ها
        </a>
        <a class="nav-link" href="cart.html" data-section="cart">
          <i class="fas fa-shopping-cart ms-2"></i>
          سبد خرید
        </a>
        <a class="nav-link" href="mycourses.html" data-section="mycourses">
          <i class="fas fa-graduation-cap ms-2"></i>
          دوره‌های من
        </a>
        <a class="nav-link" href="myProducts.html" data-section="myproducts">
          <i class="fas fa-box ms-2"></i>
          محصولات من
        </a>
        <a class="nav-link" href="news.html" data-section="news">
          <i class="fas fa-newspaper ms-2"></i>
          اخبار
        </a>
        <a class="nav-link" href="profile.html" data-section="profile">
          <i class="fas fa-user-edit ms-2"></i>
          ویرایش پروفایل
        </a>
        <a class="nav-link" href="support.html" data-section="support">
          <i class="fas fa-headset ms-2"></i>
          پیام به پشتیبانی
        </a>
        <hr class="my-3" />
        <a class="nav-link" href="../home.html">
          <i class="fas fa-store ms-2"></i>
          مشاهده فروشگاه
        </a>
        <a
          class="nav-link"
          href="#"
          onclick="DashboardManager.showLogoutModal()"
        >
          <i class="fas fa-sign-out-alt ms-2"></i>
          خروج
        </a>
      </nav>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Header -->
      <header class="header">
        <div class="container-fluid">
          <div class="row align-items-center">
            <div class="col-6 col-md-8">
              <div class="d-flex align-items-center">
                <button
                  class="btn btn-outline-success d-lg-none me-3"
                  id="toggleSidebar"
                >
                  <i class="fas fa-bars"></i>
                </button>
                <h3 class="mb-0">اخبار و مقالات</h3>
              </div>
            </div>
            <div class="col-6 col-md-4">
              <div class="d-flex align-items-center justify-content-end">
                <span class="me-2 d-none d-sm-inline">سلام، رضا عزیز</span>
                <div
                  class="bg-success rounded-circle d-flex align-items-center justify-content-center"
                  style="width: 40px; height: 40px"
                >
                  <i class="fas fa-user text-white"></i>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- News Section -->
      <section id="newsSection" class="container-fluid py-4">
        <div
          class="d-flex justify-content-between align-items-center mb-4 flex-wrap"
        >
          <h4>آخرین اخبار و مقالات</h4>
          <div class="d-flex flex-wrap">
            <div class="input-group search-box me-2">
              <input
                type="text"
                class="form-control"
                placeholder="جستجوی اخبار..."
                id="newsSearch"
              />
              <button
                class="btn btn-outline-secondary"
                type="button"
                id="searchButton"
              >
                <i class="fas fa-search"></i>
              </button>
            </div>
            <select class="form-select category-filter" id="categoryFilter">
              <option value="all">همه دسته‌ها</option>
              <option value="technology">تکنولوژی</option>
              <option value="agriculture">کشاورزی</option>
              <option value="gardening">باغبانی</option>
              <option value="education">آموزشی</option>
              <option value="events">رویدادها</option>
            </select>
          </div>
        </div>

        <div class="row" id="newsContainer">
          <!-- News will be loaded here -->
        </div>

        <div class="d-flex justify-content-center mt-4">
          <button class="btn btn-outline-primary" id="loadMoreBtn">
            <i class="fas fa-redo ms-1"></i>
            بارگذاری بیشتر
          </button>
        </div>
      </section>
    </div>

    <!-- News Detail Modal -->
    <div class="modal fade" id="newsDetailModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="newsDetailTitle">جزئیات خبر</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body" id="newsDetailContent">
            <!-- News details will be loaded here -->
          </div>
          <div class="modal-footer">
            <div class="news-actions">
              <i class="fas fa-bookmark news-bookmark" id="modalBookmark"></i>
              <i
                class="fas fa-share news-share"
                onclick="NewsManager.shareNews()"
              ></i>
            </div>
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              بستن
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Logout Modal -->
    <div class="modal fade" id="logoutModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
          <div class="modal-body text-center p-4">
            <div class="mb-3">
              <i
                class="fas fa-sign-out-alt text-warning"
                style="font-size: 48px"
              ></i>
            </div>
            <h5 class="mb-3">خروج از حساب کاربری</h5>
            <p class="text-muted mb-4">
              آیا مطمئن هستید که می‌خواهید خارج شوید؟
            </p>
            <div class="d-flex justify-content-center gap-3">
              <button
                type="button"
                class="btn btn-secondary px-4"
                data-bs-dismiss="modal"
              >
                <i class="fas fa-times ms-1"></i>
                انصراف
              </button>
              <button
                type="button"
                class="btn btn-warning px-4"
                id="confirmLogout"
              >
                <i class="fas fa-sign-out-alt ms-1"></i>
                خروج
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/news.js"></script>
  </body>
</html>
